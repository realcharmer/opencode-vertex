name: Publish image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - opencode.json
      - .github/workflows/publish.yml
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      opencode_version:
        description: 'opencode release tag to build (blank = latest release)'
        required: false
        type: string
      force:
        description: 'Rebuild even if this version is already published'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  UPSTREAM_REPO: anomalyco/opencode

jobs:
  resolve:
    name: Resolve opencode version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Compute image name
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "image=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve opencode release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.opencode_version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(gh release view --repo "$UPSTREAM_REPO" --json tagName --jq .tagName)"
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not resolve an opencode release tag"
            exit 1
          fi
          echo "Resolved opencode version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether a build is needed
        id: check
        env:
          REF: ${{ env.REGISTRY }}/${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] || [ "$FORCE" = "true" ]; then
            echo "Build forced by ${{ github.event_name }} event."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "$REF is already published; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$REF is not published yet; building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.resolve.outputs.image }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.version }}
          labels: |
            org.opencontainers.image.title=opencode-vertex
            org.opencontainers.image.description=opencode on Alpine, preconfigured for Google Vertex AI
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            OPENCODE_VERSION=${{ needs.resolve.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published \`${{ needs.resolve.outputs.version }}\`"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  skipped:
    name: Up to date
    needs: resolve
    if: needs.resolve.outputs.build == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "opencode ${{ needs.resolve.outputs.version }} is already published. Skipping build." \
            >> "$GITHUB_STEP_SUMMARY"
